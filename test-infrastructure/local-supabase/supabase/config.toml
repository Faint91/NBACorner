# LOCAL TEST ONLY. Never link this project or inherit the production .env.
project_id = "nba-corner-local-test"

[api]
enabled = true
port = 55421
schemas = ["public", "nba_corner_test_control"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Preserve supplied platform function defaults; baseline contains relation access.
auto_expose_new_tables = true

[db]
port = 55422
shadow_port = 55420
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 55429

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "http://127.0.0.1:55410"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

[studio]
enabled = false

[local_smtp]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
